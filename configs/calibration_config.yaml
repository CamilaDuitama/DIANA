# Calibration analysis configuration
# Used by scripts 07 (extract_embeddings_and_logits.py) and 08 (ood_calibration_comparison.py)

# Model configuration
model:
  path: "results/training_bioproject_v5/best_model.pth"
  label_encoders: "results/training_bioproject_v5/label_encoders.json"

# Training data (for fitting Mahalanobis, energy bounds, MC bounds)
training:
  metadata: "data/splits_v5/train_metadata.tsv"
  matrix: "data/matrices/large_matrix_3070_with_frac"
  output_dir: "results/training_bioproject_v5"

# Evaluation datasets
datasets:
  # Validation set (seen labels, for calibration analysis)
  validation:
    name: "validation"
    metadata: "data/splits_v5/validation_metadata.tsv"
    predictions_dir: "results/validation_predictions_bioproject_v5_full"
    output_dir: "results/calibration_validation_v5"
    fig_dir: "paper/assets/calibration_validation"

  # Test set (seen labels during training, but separate evaluation)
  test:
    name: "test"
    metadata: "data/splits_v5/test_metadata.tsv"
    predictions_dir: "results/test_predictions_bioproject_v5"
    output_dir: "results/calibration_test_v5"
    fig_dir: "paper/assets/calibration_test"

# MC Dropout parameters
mc_dropout:
  enabled: false  # Set to true to enable MC Dropout (slow, ~30 passes per sample)
  n_passes: 30
  dropout_p: 0.2

# Plotting
plotting:
  dpi_output: 150  # DPI for output directory figures
  dpi_paper: 300   # DPI for paper figure directory
  n_bins: 10       # Number of bins for reliability diagrams
